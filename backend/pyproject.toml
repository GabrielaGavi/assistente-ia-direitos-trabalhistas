[project]
name = "assistente-direitos-trabalhistas-backend"
version = "0.1.0"
description = "Backend do Assistente Inteligente de Orientacao sobre Direitos Trabalhistas (RAG com citacoes rastreaveis)"
readme = "../README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "uuid-utils>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

# Projeto de aplicacao (nao e uma biblioteca distribuivel).
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: testes unitarios sem dependencia de banco",
    "integration: testes de integracao que exigem PostgreSQL",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py", "*/alembic/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
