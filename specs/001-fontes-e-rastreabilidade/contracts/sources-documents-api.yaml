openapi: 3.0.3
info:
  title: API de Fontes Jurídicas e Rastreabilidade Documental
  description: Endpoints para gestão de fontes oficiais, documentos normativos e auditoria de citações do Assistente de Direitos Trabalhistas.
  version: 1.0.0

paths:
  /api/v1/sources:
    get:
      summary: Listar fontes oficiais
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de fontes registradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceResponse'
                  total:
                    type: integer
    post:
      summary: Cadastrar nova fonte oficial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
      responses:
        '201':
          description: Fonte criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'

  /api/v1/sources/{id}:
    get:
      summary: Obter detalhes de uma fonte oficial
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da fonte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '404':
          description: Fonte não encontrada

  /api/v1/documents:
    get:
      summary: Listar documentos jurídicos
      parameters:
        - name: source_id
          in: query
          schema:
            type: string
            format: uuid
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentResponse'
                  total:
                    type: integer
    post:
      summary: Cadastrar novo documento normativo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        '201':
          description: Documento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'

  /api/v1/documents/{id}/status:
    patch:
      summary: Alterar status do documento (ativação/desativação)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_active
              properties:
                is_active:
                  type: boolean
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'

  /api/v1/documents/{id}/chunks:
    get:
      summary: Listar trechos estruturados de um documento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: article
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Trechos recuperados
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentChunkResponse'
                  total:
                    type: integer

  /api/v1/citations/{id}:
    get:
      summary: Consultar evidência e metadados de uma citação
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da citação e chunk associado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationDetailResponse'

components:
  schemas:
    SourceCreate:
      type: object
      required:
        - name
        - short_name
        - base_url
      properties:
        name:
          type: string
        short_name:
          type: string
        base_url:
          type: string
          format: uri
        description:
          type: string

    SourceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        short_name:
          type: string
        base_url:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    DocumentCreate:
      type: object
      required:
        - source_id
        - title
        - logical_name
        - checksum_sha256
      properties:
        source_id:
          type: string
          format: uuid
        title:
          type: string
        logical_name:
          type: string
        checksum_sha256:
          type: string
        published_at:
          type: string
          format: date-time

    DocumentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        title:
          type: string
        logical_name:
          type: string
        version:
          type: integer
        checksum_sha256:
          type: string
        published_at:
          type: string
          format: date-time
        is_active:
          type: boolean
        status:
          type: string
          enum: [PROCESSING, READY, FAILED, ACTIVE, INACTIVE]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocumentChunkResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        chunk_index:
          type: integer
        content:
          type: string
        article:
          type: string
        section:
          type: string
        paragraph:
          type: string
        official_url:
          type: string

    CitationDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        citation_number:
          type: integer
        original_quote:
          type: string
        chunk:
          $ref: '#/components/schemas/DocumentChunkResponse'
        source:
          $ref: '#/components/schemas/SourceResponse'
